<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Speisekarte &amp; Bestellung</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="topbar">
  <h1>Speisekarte</h1>
</header>

<main class="menu">
  <label class="name-field">
    Dein Name
    <input type="text" id="customerName" placeholder="z.B. Anna" maxlength="40" autocomplete="name" />
  </label>
  <div id="menuList"></div>
</main>

<div id="orderBar" class="order-bar" hidden>
  <div class="order-bar-info">
    <span id="orderCount">0</span> Artikel · <span id="orderTotal">0,00 €</span>
  </div>
  <button id="submitOrder" class="primary-btn">Bestellung senden</button>
</div>

<div id="confirmation" class="confirmation" hidden>
  <div class="confirmation-box">
    <h2>Bestellung aufgegeben ✅</h2>
    <p>Danke, <strong id="confirmName"></strong>!</p>
    <p>Bestellnummer: <strong id="confirmOrderId"></strong></p>
    <p>Status: <span id="confirmStatus">Neu</span></p>
    <button id="newOrder" class="primary-btn">Neue Bestellung</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/order.js"></script>
</body>
</html>
